<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>U Link 注册原型</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage">
      <section class="phone" aria-label="U Link 注册原型">
        <header class="status-bar" aria-hidden="true">
          <span>9:41</span>
          <span class="status-icons">5G 100%</span>
        </header>

        <nav class="mini-nav" aria-label="小程序导航">
          <button class="icon-button" type="button" aria-label="返回">
            <span aria-hidden="true">‹</span>
          </button>
          <span class="mini-title">U Link</span>
          <button class="capsule" type="button" aria-label="更多">
            <span></span>
            <span></span>
          </button>
        </nav>

        <section class="screen screen-active" id="welcome-screen" data-screen="welcome">
          <div class="hero">
            <div class="app-mark" aria-hidden="true">L</div>
            <p class="eyebrow">U Link begins here</p>
            <h1>欢迎来到<br />U Link</h1>
            <p class="lede">用微信快速登录，再补充一点基础资料，让校园连接更准确。</p>
          </div>

          <div class="bottom-area">
            <button class="primary-button" type="button" id="wechat-login-button">
              <span class="wechat-icon" aria-hidden="true">
                <img src="./assets/wechat-logo.svg" alt="" />
              </span>
              用微信登录
            </button>
            <p class="privacy-note">登录即表示你同意后续按小程序规范完成授权与资料填写。</p>
          </div>
        </section>

        <section class="screen" id="profile-screen" data-screen="profile" aria-labelledby="profile-title">
          <div class="content">
            <p class="eyebrow">Step 2</p>
            <h1 id="profile-title">完善资料</h1>
            <p class="lede">这些信息会用于创建你的校园身份。手机号仅用于账号安全与必要通知。</p>

            <div class="mode-card" aria-label="手机号场景切换">
              <p>手机号获取方式</p>
              <div class="segmented">
                <button class="segment segment-active" type="button" data-phone-mode="wechat">
                  微信已绑定
                </button>
                <button class="segment" type="button" data-phone-mode="sms">
                  短信验证
                </button>
              </div>
            </div>

            <form class="form" id="register-form" novalidate>
              <section class="form-group" aria-label="基础资料">
                <label class="form-row" for="name-input">
                  <span>姓名</span>
                  <input id="name-input" name="name" type="text" placeholder="请输入真实姓名" autocomplete="name" />
                </label>

                <div class="form-row phone-row" id="wechat-phone-row">
                  <span>手机号</span>
                  <div class="row-value">
                    <strong id="wechat-phone-value">138 •••• 8246</strong>
                    <button class="link-button" type="button" id="change-phone-button">更换</button>
                  </div>
                </div>

                <label class="form-row sms-only hidden" for="phone-input">
                  <span>手机号</span>
                  <input
                    id="phone-input"
                    name="phone"
                    type="tel"
                    placeholder="输入手机号"
                    inputmode="numeric"
                    autocomplete="tel"
                  />
                </label>

                <label class="form-row sms-only hidden" for="code-input">
                  <span>验证码</span>
                  <div class="inline-field">
                    <input id="code-input" name="code" type="text" placeholder="6位验证码" inputmode="numeric" />
                    <button class="code-button" type="button" id="send-code-button">获取</button>
                  </div>
                </label>
              </section>

              <section class="form-group" aria-label="个人信息">
                <div class="form-row form-row-stack">
                  <span>性别</span>
                  <div class="choice-row" role="radiogroup" aria-label="性别">
                    <button class="choice choice-active" type="button" data-gender="男">男</button>
                    <button class="choice" type="button" data-gender="女">女</button>
                    <button class="choice" type="button" data-gender="不透露">不透露</button>
                  </div>
                </div>

                <label class="form-row" for="birthday-input">
                  <span>生日</span>
                  <input id="birthday-input" name="birthday" type="date" max="2026-08-04" />
                </label>
              </section>
            </form>

            <p class="error-message" id="error-message" role="alert" aria-live="polite"></p>
          </div>

          <div class="bottom-area bottom-area-solid">
            <button class="primary-button" type="button" id="submit-button">完成注册</button>
          </div>
        </section>

        <section class="screen" id="success-screen" data-screen="success" aria-labelledby="success-title">
          <div class="success-content">
            <div class="success-ring" aria-hidden="true">
              <span>✓</span>
            </div>
            <p class="eyebrow">Ready</p>
            <h1 id="success-title">注册完成</h1>
            <p class="lede">你好，<strong id="success-name">同学</strong>。你的 U Link 身份已经准备好了。</p>
          </div>

          <div class="summary-card" aria-label="注册信息摘要">
            <div>
              <span>手机号</span>
              <strong id="summary-phone">138 •••• 8246</strong>
            </div>
            <div>
              <span>性别</span>
              <strong id="summary-gender">男</strong>
            </div>
            <div>
              <span>生日</span>
              <strong id="summary-birthday">未填写</strong>
            </div>
          </div>

          <div class="bottom-area">
            <button class="primary-button" type="button" id="restart-button">重新查看流程</button>
          </div>
        </section>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
